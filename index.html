<title>Generalísimo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&family=VT323&display=swap">
<link rel="stylesheet" href="styles/game.css">

<main class="stage" id="stage" aria-label="Generalísimo">
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="route bev" id="route" hidden><span class="date" id="r-date"></span><ol id="r-stops"></ol></div>

  <div class="hud" id="hud" hidden>
    <div class="bev" id="h-army"></div>
    <div class="bev" id="h-allies"></div>
    <div class="bev h-ctl">
      <div class="h-top"><span id="h-ch"></span><span id="h-seed"></span></div>
      <div class="h-date" id="h-date"></div>
      <div id="h-race"></div>
      <div class="h-btns">
        <button type="button" id="b-map">MAP [M]</button>
        <button type="button" id="b-gen">GENERALS [G]</button>
        <button type="button" id="b-menu">MENU</button>
      </div>
    </div>
  </div>

  <section class="dlg bev" id="dlg" hidden aria-live="polite"></section>

  <section class="ovl C" id="ov-air" hidden></section>
  <section class="ovl C" id="ov-council" hidden></section>
  <section class="ovl C" id="ov-vote" hidden></section>
  <section class="ovl C" id="ov-map" hidden></section>
  <section class="ovl C" id="ov-gen" hidden></section>
  <section class="ovl A shade" id="ov-card" hidden></section>
  <section class="ovl A shade" id="ov-end" hidden></section>
  <section class="ovl A" id="ov-title" hidden></section>

  <div class="loading" id="loading">LOADING…</div>
</main>
<p class="rotate">Turn your phone sideways for a bigger view.</p>

<script type="module" src="src/main.js"></script>
